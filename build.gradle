plugins {
    id 'java'
}

group = 'com.Pumpgun.MomentumControl'
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.24-alpha'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    archiveBaseName.set('MomentumControlPlugin')
    archiveVersion.set('1.1.0')
    manifest {
        attributes(
            'Main-Class': 'com.Pumpgun.MomentumControl.MomentumControlPlugin'
        )
    }
}
